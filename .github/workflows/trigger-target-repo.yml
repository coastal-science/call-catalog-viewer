name: Trigger Target Repo
on:
  push:
    branches:
      - main # Trigger this workflow on pushes to main branch
      - johnford
      - release2.0

  workflow_dispatch:

jobs:
  trigger-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Repo name
        run: |
          REPO_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}
          echo "REPO_NAME=$REPO_NAME"
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV

      - name: Generate GitHub App installation token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Restrict to the target repo and any private repos you need to check out:
          repositories: |
            ${{ vars.TARGET_REPO_NAME }}
            ${{ vars.CATALOG_FILES_1 }}
            ${{ vars.CATALOG_FILES_2 }}
            ${{ vars.CATALOG_FILES_3 }}

      - name: Check out the other (files private) repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ vars.CATALOG_FILES_1 }}
          ref: ${{ env.FILES_REPO_BRANCH }}
          path: ${{ vars.CATALOG_FILES_1 }}
          token: ${{ steps.generate-token.outputs.token }}
          fetch-tags: true

      - name: Dispatch repository_dispatch event (using GitHub App token)
        env:
          OWNER: ${{ github.repository_owner }}
          TARGET_REPO_NAME: ${{ vars.TARGET_REPO_NAME }}
          REPO_NAME: ${{ env.REPO_NAME }}
          APP_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "Using app token (length): ${#APP_TOKEN}"

          # Send the repository_dispatch
          HTTP_CODE=$(curl -sS -o /tmp/dispatch_response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${APP_TOKEN}" \
            "https://api.github.com/repos/${OWNER}/${TARGET_REPO_NAME}/dispatches" \
            -d "{\"event_type\":\"${REPO_NAME}\",\"client_payload\":{\"message\":\"Hello from source repo!\"}}" \
          )

          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 204 ] || [ "$HTTP_CODE" -eq 201 ]; then
            echo "repository_dispatch sent successfully."
            # repository_dispatch returns 204 No Content on success
          else
            echo "Failed to send repository_dispatch. HTTP code: $HTTP_CODE"
            echo "Response body:"
            cat /tmp/dispatch_response.json || true
            exit 1
          fi
