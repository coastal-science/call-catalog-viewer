# Build system configuration for markdown-based HTML pages.
#
# Format:
#   pages:
#     - output: output.html
#       markdown: markdown.md
#       description: Meta description text
#       anchor: true|false
#       code: true|false
#       zero_md_attrs: optional attributes (e.g., "no-shadow")
#
# - All files must be in project root (flat directory structure).
# - "anchor" and "code" are boolean values (true/false).
# - "zero_md_attrs" is optional and may be omitted or empty.
#
# To add a new page:
#   1. Create the markdown file in project root
#   2. Add an entry here with the output HTML filename
#   3. Run: src/build-markdown-pages.sh

pages:
  # FAQ page (with code highlighting for examples)
  - output: faq.html
    markdown: FAQ.md
    description: "Have questions about the Orca Call Catalogue Library at SFU's HALLO project? Check out our FAQ page for answers on accessing resources and materials for effective learning, teaching, and more."
    anchor: true
    code: true
    zero_md_attrs: "no-shadow"

  # License page
  - output: license.html
    markdown: LICENSE.md
    description: "Learn about the licensing agreements and terms of use for the resources available at the Call Catalogue Library, part of SFU's HALLO project. Understand your rights and responsibilities."
    anchor: false
    code: false

  # About the Catalogue page
  - output: about-the-catalogue.html
    markdown: Aboutthecatalogue.md
    description: "Learn about the Orca Call Catalogue - a curated collection of orca acoustics and annotations used in machine learning datasets, gathered through decades of research."
    anchor: true
    code: false

  # About Killer Whale Sounds page
  - output: about-killer-whale-sounds.html
    markdown: AboutKillerWhalesounds.md
    description: "Discover the fascinating world of killer whale sounds - learn about call types, dialects, repertoires, and what researchers can learn from studying orca acoustics."
    anchor: true
    code: false

  # How to Cite page
  - output: how-to-cite.html
    markdown: Howtocite.md
    description: "Learn how to properly cite the Orca Call Catalogue and understand the licensing terms under Open Government Licence Canada 2.0."
    anchor: true
    code: true
    zero_md_attrs: "no-shadow"

