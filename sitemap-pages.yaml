# Public pages included in sitemap.xml.
# Generated by: src/build-sitemap.sh
#
# To add a page:
#   1. Add an entry under pages below
#   2. Run: src/build-sitemap.sh
#      (also runs automatically at the end of src/build-markdown-pages.sh)

base_url: https://orca.research.sfu.ca/call-library

pages:
  # Main pages
  - path: index.html
    changefreq: weekly
    priority: 1.0

  - path: home.html
    changefreq: monthly
    priority: 0.9

  # Information pages
  - path: about-the-catalogue.html
    changefreq: monthly
    priority: 0.8

  - path: about-killer-whale-sounds.html
    changefreq: monthly
    priority: 0.8

  # Legal / reference
  - path: license.html
    changefreq: yearly
    priority: 0.7

  - path: licence-and-how-to-cite.html
    changefreq: yearly
    priority: 0.7

  # FAQ
  - path: faq.html
    changefreq: monthly
    priority: 0.8

  # Acknowledgements
  - path: acknowledgements.html
    changefreq: yearly
    priority: 0.7

  # Contact
  - path: contact.html
    changefreq: yearly
    priority: 0.7
